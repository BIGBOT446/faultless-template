<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<!-- Include Quill script -->
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<div id="editor" style="height: 300px;"></div>


{{ p|json_script:"jsonText" }}
{% for key, value in words.items %}
    <button onclick="toggleHighlight(this)" id="{{ key }}" data-pos="{{ value }}">{{ key }}</button>
{% endfor %}

<div>
    {% if current > 1 %}
        <a href="{% url 'user_view' current|add:'-1' %}">Previous</a>
    {% endif %}
    {% if current < total %}
        <a href="{% url 'user_view' current|add:'1' %}">Next</a>
    {% endif %}
</div>

<script>
  var quill = new Quill('#editor', {
    theme: 'snow'
  });

  window.onload = function loadText() {
    const text = JSON.parse(document.getElementById('jsonText').textContent);
    quill.setText(text);
  };

  function toggleHighlight(obj) {
    const text = quill.getText(); // get plain text from editor
    const sentences = text.split('.')[obj.dataset.pos];
    const word = obj.id;
    const index = sentences.indexOf(word) + text.indexOf(sentences);

    if (index !== -1) {
      const currentFormat = quill.getFormat(index, word.length);

      const isHighlighted = currentFormat.background === 'yellow';

      if (isHighlighted) {
        // Remove background
        quill.formatText(index, word.length, 'background', false);
      } else {
        // Highlight with yellow background
        quill.formatText(index, word.length, 'background', 'yellow');
      }
    } else {
      alert("Word 'wake' not found.");
    }
  }
</script>
