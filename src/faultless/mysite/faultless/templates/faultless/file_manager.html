<!DOCTYPE html>
<html>

<head>
    <title>File Upload</title>

    <style>
        .file-list {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
    
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
    
        .delete-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .select-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>

</head>

<body>
    <h1>File Upload</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>

    <div class="file_list">
        <h2>Uploaded Files</h2>
        {% if documents %}
            {% for document in documents %}
            <div class="file-item">
                <span>{{ document.file.name }} - {{ document.uploaded_at }}</span>

                <div style="display: flex; gap: 10px;">
                    <form method="get" action="{% url 'get_rule' %}">
                        {% csrf_token %}
                        <input type="hidden" name="file_name" value="{{ document.file.name }}">
                        <button type="submit" name="Select" class="select-btn">Select</button>
                    </form>

                    <form method="post"  style="display: inline;">
                        {% csrf_token %}
                        <input type="hidden" name="delete_id" value="{{ document.id}}">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <p>No files uploaded yet</p>
        {% endif %}
    </ul>
    </div>

    <script>
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                if (!confirm('Are you sure you want to delete this file?')) {
                    e.preventDefault();
                }
            });
        });
    </script>

</body>

</html>
